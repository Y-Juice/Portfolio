<header class="site-header">
  <div class="site-header-inner">
    <a class="masthead-title" href="#" aria-label="Yassine Tazi portfolio home">Yassine Tazi</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <button type="button" (click)="openContactPopup()">Contact</button>
    </nav>
    <div class="header-actions">
      <button class="header-cta" type="button" (click)="openContactPopup()">Start a project</button>
    </div>
  </div>
</header>

<main class="page-shell">
  <app-hero></app-hero>
  <app-portfolio (projectSelected)="handleProjectSelect($event)"></app-portfolio>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="footer-brand">
      <a class="masthead-title" href="#" aria-label="Yassine Tazi portfolio home">Yassine Tazi</a>
    </div>
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <button type="button" (click)="openContactPopup()">Contact</button>
    </nav>
    <div class="footer-meta">
      <div class="footer-socials">
        <a
          class="footer-social"
          href="https://www.instagram.com/wara.studiodesign/"
          target="_blank"
          rel="noreferrer"
        >
          @wara.studiodesign
        </a>
        <a
          class="footer-social"
          href="https://www.linkedin.com/in/yassine-tazi2004"
          target="_blank"
          rel="noreferrer"
        >
          LinkedIn
        </a>
      </div>
      <button class="footer-link" type="button" (click)="openContactPopup()">Start a project</button>
    </div>
  </div>
</footer>

<div class="contact-overlay" *ngIf="contact.isOpen()" (click)="closeContactPopup()">
  <section
    class="contact-popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="contact-title"
    (click)="$event.stopPropagation()"
  >
    <div class="contact-top">
      <span>Contact</span>
      <button type="button" aria-label="Close contact popup" (click)="closeContactPopup()">
        Close &times;
      </button>
    </div>

    <div class="contact-body">
      <h2 id="contact-title">Work with me</h2>

      <div class="contact-list">
        @for (item of contact.items; track item.label) {
          <div class="contact-item">
            <span>{{ item.label }}</span>
            <a *ngIf="item.href; else plainContact" [href]="item.href" target="_blank" rel="noreferrer">
              {{ item.value }}
            </a>
            <ng-template #plainContact>
              <strong>{{ item.value }}</strong>
            </ng-template>
          </div>
        }
      </div>
    </div>
  </section>
</div>

<app-project-modal
  *ngIf="selectedProject()"
  [project]="selectedProject()"
  (closed)="handleModalClose()"
></app-project-modal>
