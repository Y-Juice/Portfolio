<header class="site-header">
  <div class="site-header-inner">
    <a class="masthead-title" href="#" aria-label="Yassine Tazi portfolio home">Yassine Tazi</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="mailto:yassine.tazi@hotmail.com">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="header-cta" href="mailto:yassine.tazi@hotmail.com">Work With Me</a>
      <app-theme-toggle></app-theme-toggle>
    </div>
  </div>
</header>

<main class="page-shell">
  <app-hero></app-hero>
  <app-portfolio (projectSelected)="handleProjectSelect($event)"></app-portfolio>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <div>
      <span class="footer-kicker">Planning a project?</span>
      <strong>Let us build something clean, fast, and useful.</strong>
    </div>
    <a class="footer-link" href="mailto:yassine.tazi@hotmail.com">Get in touch</a>
  </div>
</footer>

<app-project-modal
  *ngIf="selectedProject()"
  [project]="selectedProject()"
  (closed)="handleModalClose()"
></app-project-modal>
