<section class="portfolio">
  <div class="portfolio-header">
    <span class="section-eyebrow">§ 02 · Selected Work</span>
    <h2>Projects</h2>
    <p class="subtitle">
      Interactive builds focused on crisp typography, careful motion, and clean UX.
    </p>
  </div>

  <div class="portfolio-list">
    <article
      class="project-card"
      *ngFor="let project of projects(); let i = index"
      (click)="openProject(project)"
      #projectCard
    >
      <div class="project-index">
        <span class="index-num">{{ formatIndex(i) }}</span>
        <span class="index-label">Entry</span>
      </div>

      <div class="project-img" [style.backgroundImage]="'url(' + project.thumbnail + ')'"></div>

      <div class="project-content">
        <h3>{{ project.title }}</h3>
        <p class="excerpt">{{ project.shortDescription }}</p>
        <div class="tags">
          <span class="tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
        </div>
      </div>

      <div class="project-cta">
        <span class="cta-text">Read case</span>
        <span class="cta-arrow">&rarr;</span>
      </div>
    </article>
  </div>

  <p class="error" *ngIf="error()">{{ error() }}</p>
</section>
