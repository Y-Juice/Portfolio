<section class="portfolio" id="work">
  <div class="portfolio-section" id="development-work">
    <div class="portfolio-header">
      <h2>Development</h2>
    </div>

    <div class="portfolio-list" *ngIf="developerProjects().length; else devEmptyState">
      <article
        class="project-card"
        *ngFor="let project of developerProjects()"
        (click)="openProject(project)"
        #projectCard
      >
        <div
          class="project-img"
          [style.backgroundColor]="
            project.thumbnailBackground || thumbnailColors()[project.id] || '#e8e8e8'
          "
        >
          <img
            [src]="project.thumbnail"
            [alt]="project.title"
            [attr.crossorigin]="isExternalThumbnail(project.thumbnail) ? 'anonymous' : null"
            (load)="onThumbnailLoad(project, $event)"
          />
        </div>
        <div class="project-body">
          <h3>{{ project.title }}</h3>
          <span class="cta-text">View &rarr;</span>
        </div>
      </article>
    </div>

    <ng-template #devEmptyState>
      <div class="empty-state">
        <p>No projects yet.</p>
      </div>
    </ng-template>
  </div>

  <div class="portfolio-section" id="design-work">
    <div class="portfolio-header">
      <h2>Design</h2>
    </div>

    <div class="portfolio-list" *ngIf="designerProjects().length; else designEmptyState">
      <article
        class="project-card"
        *ngFor="let project of designerProjects()"
        (click)="openProject(project)"
        #projectCard
      >
        <div
          class="project-img"
          [style.backgroundColor]="
            project.thumbnailBackground || thumbnailColors()[project.id] || '#e8e8e8'
          "
        >
          <img
            [src]="project.thumbnail"
            [alt]="project.title"
            [attr.crossorigin]="isExternalThumbnail(project.thumbnail) ? 'anonymous' : null"
            (load)="onThumbnailLoad(project, $event)"
          />
        </div>
        <div class="project-body">
          <h3>{{ project.title }}</h3>
          <span class="cta-text">View &rarr;</span>
        </div>
      </article>
    </div>

    <ng-template #designEmptyState>
      <div class="empty-state">
        <p>No projects yet.</p>
      </div>
    </ng-template>
  </div>

  <p class="error" *ngIf="error()">{{ error() }}</p>
</section>
