<section class="portfolio">
  <div class="portfolio-header">
    <span class="section-eyebrow">{{ sectionMeta().eyebrow }}</span>
    <h2>{{ mode() === 'developer' ? 'Projects' : 'Design Work' }}</h2>
    <p class="subtitle">{{ sectionMeta().subtitle }}</p>
  </div>

  <div class="portfolio-list" *ngIf="projects().length; else emptyState">
    <article
      class="project-card"
      *ngFor="let project of projects(); let i = index"
      (click)="openProject(project)"
      #projectCard
    >
      <div class="project-index">
        <span class="index-num">{{ formatIndex(i) }}</span>
        <span class="index-label">Entry</span>
      </div>

      <div class="project-img" [style.backgroundImage]="'url(' + project.thumbnail + ')'"></div>

      <div class="project-content">
        <h3>{{ project.title }}</h3>
        <p class="excerpt">{{ project.shortDescription }}</p>
        <div class="tags">
          <span class="tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
        </div>
      </div>

      <div class="project-cta">
        <span class="cta-text">Read case</span>
        <span class="cta-arrow">&rarr;</span>
      </div>
    </article>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <span class="empty-label">No entries</span>
      <p>No projects in this mode yet.</p>
    </div>
  </ng-template>

  <p class="error" *ngIf="error()">{{ error() }}</p>
</section>
