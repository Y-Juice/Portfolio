<section class="hero">
  <div class="hero-top">
    <span class="issue-tag" #roleRef>{{ role }}</span>
    <span class="issue-date">Edition · MMXXVI</span>
  </div>

  <div class="hero-main">
    <img [src]="profileImage" alt="Portrait of {{ name }}" class="profile-image" />

    <div class="hero-text">
      <h1 #titleRef>{{ name }}</h1>
      <p class="tagline">Measure craft. Compose interfaces.</p>
      <p class="description" #descRef>{{ description }}</p>
    </div>
  </div>

  <div class="meta-grid">
    <div class="meta-cell">
      <span class="meta-label">Discipline</span>
      <span class="meta-value">Front-end</span>
    </div>
    <div class="meta-cell">
      <span class="meta-label">Focus</span>
      <span class="meta-value">React &amp; TS</span>
    </div>
    <div class="meta-cell">
      <span class="meta-label">Based in</span>
      <span class="meta-value">Brussels</span>
    </div>
    <div class="meta-cell">
      <span class="meta-label">Status</span>
      <span class="meta-value available">Open to work</span>
    </div>
  </div>

  <div class="stack">
    <span class="stack-label">Toolkit</span>
    <div class="stack-list" #badgesRef>
      <span class="stack-item" *ngFor="let tech of techStack; let i = index">
        <span class="stack-code">{{ formatIndex(i) }}</span>
        <span class="stack-name">{{ tech.label }}</span>
      </span>
    </div>
  </div>
</section>
