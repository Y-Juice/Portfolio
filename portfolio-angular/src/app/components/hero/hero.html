<section class="hero">
  <div class="hero-top">
    <span class="issue-tag" #roleRef>{{ role }}</span>
    <span class="issue-date">Edition · MMXXVI</span>
  </div>

  <div class="hero-main">
    <img [src]="profileImage" alt="Portrait of {{ name }}" class="profile-image" />

    <div class="hero-text">
      <h1 #titleRef>{{ name }}</h1>
      <p class="tagline">{{ tagline }}</p>
      <p class="description" #descRef>{{ description }}</p>
    </div>
  </div>

  <div class="meta-grid">
    <div class="meta-cell">
      <span class="meta-label">Discipline</span>
      <span class="meta-value">Dev &amp; Design</span>
    </div>
    <div class="meta-cell">
      <span class="meta-label">Focus</span>
      <span class="meta-value">React &amp; TS</span>
    </div>
    <div class="meta-cell">
      <span class="meta-label">Based in</span>
      <span class="meta-value">Vilvoorde, BE</span>
    </div>
    <div class="meta-cell">
      <span class="meta-label">Status</span>
      <span class="meta-value available">Open to work</span>
    </div>
  </div>

  <div class="stack-groups" #badgesRef>
    <div class="stack" *ngFor="let group of skillGroups">
      <span class="stack-label">{{ group.label }}</span>
      <div class="stack-list">
        <span class="stack-item" *ngFor="let skill of group.items; let i = index">
          <span class="stack-code">{{ formatIndex(i) }}</span>
          <span class="stack-name">{{ skill }}</span>
        </span>
      </div>
    </div>
  </div>
</section>
