<section class="hero">
  <div class="hero-top">
    <span class="issue-tag" #roleRef>{{ role }}</span>
  </div>

  <div class="hero-main">
    <div class="hero-text">
      <h1 #titleRef>
        Built for<br />
        <span>growth</span>
      </h1>
      <p class="description" #descRef>{{ description }}</p>
      <div class="hero-actions">
        <a class="button primary" href="#work">View work</a>
        <button class="button ghost" type="button" (click)="openContactPopup()">Contact</button>
      </div>
    </div>

    <aside class="hero-panel" id="about">
      <img [src]="profileImage" alt="Portrait of {{ name }}" class="profile-image" />
      <div class="panel-copy">
        <strong>{{ name }}</strong>
        <p>Vilvoorde, BE</p>
      </div>
    </aside>
  </div>

  <div class="service-strip" id="services" aria-label="Services">
    <span *ngFor="let service of servicePillars">{{ service }}</span>
  </div>

  <div class="stack-groups" #badgesRef>
    <div class="stack" *ngFor="let group of skillGroups">
      <span class="stack-label">{{ group.label }}</span>
      <div class="stack-list">
        <span class="stack-item" *ngFor="let skill of group.items">{{ skill }}</span>
      </div>
    </div>
  </div>
</section>
