<div class="overlay" #overlay (click)="onOverlayClick($event)">
  <div class="modal" #dialog (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <div class="modal-top">
      <span class="modal-eyebrow">Project</span>
      <button class="close" type="button" aria-label="Close project" (click)="close()">
        <span aria-hidden="true">Close &times;</span>
      </button>
    </div>

    <img
      *ngIf="project?.fullImage"
      [src]="project?.fullImage"
      [alt]="project?.title"
      class="hero-image"
    />

    <div class="modal-body">
      <div class="modal-intro">
        <h2>{{ project?.title }}</h2>
      </div>
      <p class="long-description">{{ project?.longDescription }}</p>

      <div class="modal-section">
        <h3>Features</h3>
        <ul class="feature-list">
          <li *ngFor="let feature of project?.features">{{ feature }}</li>
        </ul>
      </div>

      <div class="modal-section">
        <h3>Stack</h3>
        <div class="tag-list">
          <span class="tag" *ngFor="let tech of project?.technologies">{{ tech }}</span>
        </div>
      </div>

      <div class="links">
        <a
          *ngIf="project?.liveDemoEnable && project?.demoUrl"
          class="button primary"
          [href]="project?.demoUrl"
          target="_blank"
          rel="noreferrer"
        >
          Live Demo &rarr;
        </a>

        <a
          *ngIf="project?.githubUrlEnable && project?.githubUrl"
          class="button ghost"
          [href]="project?.githubUrl"
          target="_blank"
          rel="noreferrer"
        >
          View on GitHub &rarr;
        </a>
      </div>
    </div>
  </div>
</div>
